<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFI Network Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center">✨ SWIFI Network ✨</h1>
        <p class="text-center text-muted">Звёздная/ячеистая топология | ipybyte (2⁹⁰ B) | трафик в реальном времени</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">Топология сети</div>
                    <div class="card-body">
                        <div id="graph" style="width:100%; height:400px; background:#1e2a3a; border-radius:12px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">Статистика узлов</div>
                    <div class="card-body">
                        <canvas id="trafficChart" width="400" height="200"></canvas>
                        <div id="nodeTable" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4 shadow">
            <div class="card-header bg-info text-white">Отправить тестовый пакет</div>
            <div class="card-body row g-3">
                <div class="col-md-3">
                    <label>Отправитель</label>
                    <select id="srcSelect" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <label>Получатель</label>
                    <select id="dstSelect" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <label>Размер (байт)</label>
                    <input type="number" id="pktSize" class="form-control" value="1024">
                </div>
                <div class="col-md-3">
                    <label>Приоритет</label>
                    <select id="prioritySelect" class="form-select">
                        <option value="0">Низкий</option>
                        <option value="1">Средний</option>
                        <option value="2">Высокий</option>
                    </select>
                </div>
                <div class="col-12">
                    <button id="sendBtn" class="btn btn-warning w-100">🚀 Отправить пакет</button>
                </div>
            </div>
            <div id="sendResult" class="card-footer text-muted"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
